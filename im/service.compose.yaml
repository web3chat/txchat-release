version: "2.4"
services:
  comet:
    image: txchat-comet:${COMET_IMAGE}
    container_name: ${COMET_CONTAINER_NAME}
    networks:
      - txchat-components
      - txchat-service
    volumes:
      - ${COMET_CONFIG_VOLUME}:/etc/comet/config
    ports:
      - "3101:3101"
      - "3102:3102"
    depends_on:
      - etcd
  logic:
    image: txchat-logic:${LOGIC_IMAGE}
    container_name: ${LOGIC_CONTAINER_NAME}
    networks:
      - txchat-components
      - txchat-service
    environment:
      # 与 dtalk components 中 MySQL 的 MYSQL_ROOT_PASSWORD 保持一致
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 联邦 Presence（init-compose 从 dtalk .env / key 同步到本项目 .env）
      PRESENCE_URL: ${PRESENCE_URL}
      CLUSTER_ID: ${CLUSTER_ID}
    volumes:
      - ${LOGIC_CONFIG_VOLUME}:/etc/logic/config
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      comet:
        condition: service_started
      etcd:
        condition: service_started
networks:
  txchat-components:
    external: true
  txchat-service:
    external: true
volumes:
  txchat-comet-config:
    external: true
  txchat-logic-config:
    external: true
