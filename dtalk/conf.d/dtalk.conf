upstream gateway {
        server txchat-gateway-node1:19000;
}

upstream disc {
        server txchat-discovery-node1:18001;
}

upstream backup {
        server txchat-backup-node1:18004;
}

upstream oss {
        server txchat-oss-node1:18005;
}

upstream comet {
        server txchat-comet-node1:3102;
}

upstream backend {
        server txchat-backend-node1:18102;
}

upstream call {
        server txchat-call-node1:18013;
}

upstream square {
        server txchat-square:18100;
}

server {

	listen       8888;
    server_name  localhost;

    add_header Access-Control-Allow-Origin *;
	add_header Access-Control-Allow-Headers *;
	add_header Access-Control-Allow-Methods *;

	add_header Access-Control-Allow-Credentials 'true';

	# 广场的预检要交给广场自己回答。这里若直接 204，会带上上面的
	# Allow-Origin * 和 Allow-Credentials true，浏览器会取消上传。
	set $options_here 0;
	if ($request_method = OPTIONS) {
		set $options_here 1;
	}
	if ($uri ~ ^/square/) {
		set $options_here 0;
	}
	if ($options_here = 1) {
		return 204;
	}

	location /ping {
		return 200;
	}

	location / {
                proxy_pass http://gateway/;
                proxy_redirect default;
                proxy_set_header Host $host;
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_cookie_path / /;
        }

	location /disc/ {
		proxy_pass http://disc/;
		proxy_redirect default;
		proxy_set_header Host $host;
		proxy_set_header X-real-ip $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_cookie_path / /;
	}

	location /app/version/ {
                proxy_pass http://backend/app/version/;
                proxy_redirect default;
                proxy_set_header Host $host;
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_cookie_path / /;
        }

    location /app/cdk/ {
            proxy_pass http://backend/app/cdk/;
            proxy_redirect default;
            proxy_set_header Host $host;
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cookie_path / /;
    }

	location /backend/ {
                proxy_pass http://backend/backend/;
                proxy_redirect default;
                proxy_set_header Host $host;
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_cookie_path / /;
        }

	location /backup/ {
                proxy_pass http://backup/;
                proxy_redirect default;
                proxy_set_header Host $host;
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_cookie_path / /;
        }

	location /oss/ {
                client_max_body_size 20m;
                proxy_pass http://oss/;
                proxy_redirect default;
                proxy_set_header Host $host;
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_cookie_path / /;
        }

    location /call/ {
            proxy_pass http://call/;
            proxy_redirect default;
            proxy_set_header Host $host;
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cookie_path / /;
    }

    # proxy_pass 不带 URI，原样保留 /square 前缀。
    # Host 必须带端口。$host 会去掉 :8888，浏览器 Origin 仍是
    # http://地址:8888，广场会当成跨域并直接 403。
    location /square/ {
            # 本段只要有 add_header，就不再继承 server 上的
            # Access-Control-Allow-Origin *。那个 * 会和广场返回的具体来源
            # 叠成两个头，浏览器丢掉上传响应，页面显示失败。
            add_header X-Square-Cors passthrough always;
            client_max_body_size 3m;
            proxy_pass http://square;
            proxy_redirect default;
            proxy_set_header Host $http_host;
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header FZM-SIGNATURE $http_fzm_signature;
            proxy_set_header Authorization $http_authorization;
            proxy_cookie_path / /;
    }

	location /sub/ {
                proxy_pass http://comet/sub;
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header Host $host;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400;
        }

	 
}